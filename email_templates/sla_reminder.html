<!--
  Internal email — sent to the assigned technician when a ticket is
  approaching or has breached its SLA window.

  Tokens: tech_name, ticket_no, title, priority, status, hours_elapsed,
  sla_hours, level_label ("approaching" or "breached")
-->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 560px; margin: 0 auto; color: #1f2937;">
  <div style="background: {{banner_color}}; padding: 16px 24px; border-radius: 8px 8px 0 0;">
    <span style="color: #ffffff; font-size: 16px; font-weight: bold;">SLA {{level_label}} — {{ticket_no}}</span>
  </div>
  <div style="border: 1px solid #e5e7eb; border-top: none; padding: 24px; border-radius: 0 0 8px 8px;">
    <p>Hi {{tech_name}},</p>
    <p>Ticket <strong>{{ticket_no}}</strong> — "{{title}}" ({{priority}} priority) is {{level_label}} its SLA window.</p>
    <table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
      <tr><td style="padding: 6px 0; color: #6b7280; font-size: 13px;">Status</td><td style="padding: 6px 0;">{{status}}</td></tr>
      <tr><td style="padding: 6px 0; color: #6b7280; font-size: 13px;">Time open</td><td style="padding: 6px 0;">{{hours_elapsed}} hours (SLA: {{sla_hours}}h)</td></tr>
    </table>
    <p>Please review it in the portal at your earliest convenience.</p>
  </div>
</div>
